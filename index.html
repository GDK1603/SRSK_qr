    <script>
      // Suppress Vite HMR WebSocket connection failure noise in preview iframe
      (function() {
        var originalWarn = console.warn;
        var originalError = console.error;
        console.warn = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite] failed to connect'))) {
            return;
          }
          originalWarn.apply(console, arguments);
        };
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite] failed to connect'))) {
            return;
          }
          originalError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('websocket'))) {
            e.preventDefault();
            e.stopPropagation();
          }
        });
      })();
    </script>
